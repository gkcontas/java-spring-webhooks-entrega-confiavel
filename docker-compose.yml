services:

  postgres:
    image: postgres:16-alpine
    # 5432 is free on this machine; the user's own containers publish 27017,
    # 8083 and 4873, and nothing else is listening on 5432.
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: webhooks
      POSTGRES_USER: webhooks
      POSTGRES_PASSWORD: webhooks
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U webhooks -d webhooks"]
      interval: 5s
      timeout: 3s
      retries: 10
