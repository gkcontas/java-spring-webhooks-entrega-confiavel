webhooks:
  scheduling:
    # The dispatcher and the inbox processor are called by the tests, in the
    # order they need, instead of on a timer.
    enabled: false
  sender:
    allow-private-targets: true
    connect-timeout: 500ms
    request-timeout: 1s
    lease: 5s
    max-attempts: 4
    backoff-base: 1s
    jitter: NONE
    instance-id: test-node
  receiver:
    # Two accepted secrets, as during a rotation on the receiver's side.
    secrets:
      - whsec_yzDrPREmhjqoS+ZYLsQeHz0HOSncBCw5PaDAR55IgaM=
      - whsec_Cf/yy9VYgj0TPs6Pl2feerg/9+pHDQUrVzBYmpkFbqY=
    tolerance: 5m
    workers: 4
